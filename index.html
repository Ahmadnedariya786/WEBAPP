<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#243B8F" />
    <title>Mehnat Tracker</title>
    <script>
      let t = localStorage.getItem('theme');
      if (!t) { t = 'dark'; localStorage.setItem('theme', t); }
      document.documentElement.setAttribute('data-theme', t);
      const m = document.querySelector('meta[name="theme-color"]');
      let bg = '#20242B';
      if (t === 'outdoor') {
        bg = '#F5F0E1';
      } else if (t === 'premium') {
        bg = '#171238';
      } else {
        bg = '#20242B';
      }
      if (m) m.setAttribute('content', bg);
      document.documentElement.style.backgroundColor = bg;
      if (document.body) {
        document.body.style.backgroundColor = bg;
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          if (document.body) document.body.style.backgroundColor = bg;
        });
      }
      
      window.AndroidPrepareDownload = function(filename, mime) {
        window.AndroidPreparedFilename = filename;
        window.AndroidPreparedMime = mime;
      };
    </script>
  </head>
  <body style="margin: 0; background-color: #20242B;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
