<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#243B8F" />
    <title>Mehnat Tracker</title>
    <script>
      let t = localStorage.getItem('theme');
      if (!t) { t = 'dark'; localStorage.setItem('theme', t); }
      document.documentElement.setAttribute('data-theme', t);
      
      window.AndroidPrepareDownload = function(filename, mime) {
        window.AndroidPreparedFilename = filename;
        window.AndroidPreparedMime = mime;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
