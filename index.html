<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#171238" />
    <meta name="app-version" content="વર્ઝન 6.0.0" />
    <title>Mehnat Tracker</title>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (!t) { t = 'premium'; localStorage.setItem('theme', t); }
        document.documentElement.setAttribute('data-theme', t);
        var bg = '#171238';
        if (t === 'outdoor') {
          bg = '#F5F0E1';
        } else if (t === 'dark') {
          bg = '#20242B';
        } else {
          bg = '#171238';
        }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) {
          m.setAttribute('content', bg);
        } else {
          m = document.createElement('meta');
          m.setAttribute('name', 'theme-color');
          m.setAttribute('content', bg);
          document.head.appendChild(m);
        }
        document.documentElement.style.backgroundColor = bg;
        if (document.body) {
          document.body.style.backgroundColor = bg;
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            if (document.body) document.body.style.backgroundColor = bg;
          });
        }
      })();
      
      window.AndroidPrepareDownload = function(filename, mime) {
        window.AndroidPreparedFilename = filename;
        window.AndroidPreparedMime = mime;
      };
    </script>
  </head>
  <body style="margin: 0; background-color: #171238;">
    <!-- F1 & F2: Branded Splash Screen (Zero Blank Gap, Instant Static Paint) -->
    <div id="app-splash" style="position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #171238; transition: opacity 300ms ease; user-select: none;">
      <!-- Web App Manifest Icon Replica: Purple rounded square (corner radius 25%) with folded white document and 3 magenta lines -->
      <div id="app-splash-logo-container" style="width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.28));">
        <svg id="app-splash-logo" width="112" height="112" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
          <defs>
            <linearGradient id="splash-doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d946ef" />
              <stop offset="100%" stop-color="#7e22ce" />
            </linearGradient>
          </defs>
          <rect width="112" height="112" rx="28" fill="url(#splash-doc-grad)" />
          <path d="M40 25h24l14 14v42c0 3.3-2.7 6-6 6H40c-3.3 0-6-2.7-6-6V31c0-3.3 2.7-6 6-6z" fill="#FFFFFF" />
          <path d="M64 25v14h14z" fill="#EDE9FE" />
          <rect x="46" y="49" width="20" height="4" rx="2" fill="#d946ef" />
          <rect x="46" y="59" width="20" height="4" rx="2" fill="#d946ef" />
          <rect x="46" y="69" width="14" height="4" rx="2" fill="#d946ef" />
        </svg>
      </div>
      <div id="app-splash-title" style="margin-top: 20px; font-size: 20px; font-weight: 700; color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; text-align: center; letter-spacing: 0.01em;">
        બનાસકાંઠા સ્ટુડન્ટ મહેનત ટ્રેકર
      </div>
      <div id="app-splash-version" style="margin-top: 8px; font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, 0.7); font-family: system-ui, -apple-system, sans-serif; text-align: center; letter-spacing: 0.04em;">
        વર્ઝન 6.0.0
      </div>
    </div>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        var s = document.getElementById('app-splash');
        var h = document.getElementById('app-splash-title');
        var v = document.getElementById('app-splash-version');
        var b = document.body;
        
        var vm = document.querySelector('meta[name="app-version"]');
        var vt = vm ? (vm.getAttribute('content') || 'વર્ઝન 6.0.0') : 'વર્ઝન 6.0.0';
        if (v) v.textContent = vt;

        var bg = '#171238';
        if (t === 'outdoor') {
          bg = '#F5F0E1';
          if (s) s.style.backgroundColor = bg;
          if (b) b.style.backgroundColor = bg;
          if (h) h.style.color = '#1E2F73';
          if (v) v.style.color = '#5A6BA8';
        } else if (t === 'dark') {
          bg = '#20242B';
          if (s) s.style.backgroundColor = bg;
          if (b) b.style.backgroundColor = bg;
          if (h) h.style.color = '#F3F4F6';
          if (v) v.style.color = '#9CA3AF';
        } else {
          // premium or unset
          bg = '#171238';
          if (s) s.style.backgroundColor = bg;
          if (b) b.style.backgroundColor = bg;
          if (h) h.style.color = '#FFFFFF';
          if (v) v.style.color = 'rgba(255, 255, 255, 0.7)';
        }

        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bg);

        // F3: Fade and Remove on app-ready, with 4000ms safety fallback
        var splashFaded = false;
        function hideSplash() {
          if (window.__holdSplashForInspection) return;
          if (splashFaded) return;
          splashFaded = true;
          if (!s) return;
          s.style.transition = 'opacity 300ms ease';
          s.style.opacity = '0';
          s.style.pointerEvents = 'none';
          setTimeout(function() {
            if (s && s.parentNode) {
              s.parentNode.removeChild(s);
            }
          }, 350);
        }

        window.addEventListener('app-ready', hideSplash, { once: true });
        setTimeout(hideSplash, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
